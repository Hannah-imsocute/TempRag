services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      POSTGRES_HOST: postgre
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: rag
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      NO_PROXY: "localhost,127.0.0.1,ollama,weaviate,postgre"
      no_proxy: "localhost,127.0.0.1,ollama,weaviate,postgre"
      LLM_MODEL: "${LLM_MODEL:-exaone3.5:7.8b}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-qwen3-embedding:8b}"
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_HOST: weaviate
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_COLLECTION: "${WEAVIATE_COLLECTION:-Test}"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - db-connect
    restart: unless-stopped

networks:
  db-connect:
    external: true
